<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FoxOS Desktop</title>
    <style>
        :root {
            --fox-orange: #ff6000;
            --fox-dark: #121214;
            --fox-bar: #1e1e24;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background: var(--fox-dark); color: #fff; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }

        /* Systémová lišta */
        .taskbar {
            height: 40px; background: var(--fox-bar); display: flex;
            align-items: center; padding: 0 12px; gap: 10px; border-bottom: 1px solid #333;
        }
        
        .sys-btn {
            background: var(--fox-orange); color: #fff; border: none;
            padding: 5px 12px; border-radius: 4px; font-weight: bold; cursor: pointer;
        }

        .status-text { font-size: 12px; color: #aaa; margin-left: auto; }

        /* Okno prohlížeče */
        .window { flex: 1; display: flex; flex-direction: column; background: #000; }
        .address-bar { display: flex; background: #222; padding: 6px; gap: 6px; }
        .address-bar input { flex: 1; background: #111; border: 1px solid #444; color: #fff; padding: 6px; border-radius: 4px; }
        
        iframe { flex: 1; border: none; background: #fff; }
    </style>
</head>
<body>

    <!-- Horní systémová lišta FoxOS -->
    <div class="taskbar">
        <button class="sys-btn" onclick="FoxOS.openApp('FoxBrowser', 'https://bing.com')">FoxBrowser</button>
        <span class="status-text" id="fox-status">FoxOS Běží (GitHub Moduly)</span>
    </div>

    <!-- Okno s aplikací -->
    <div class="window">
        <div class="address-bar">
            <input type="text" id="urlInput" placeholder="Zadejte adresu nebo spusťte modul přes skript..." value="https://bing.com">
            <button class="sys-btn" onclick="loadSite()">Načíst</button>
        </div>
        <iframe id="foxbrowser-frame" src="about:blank"></iframe>
    </div>

    <!-- NAČTENÍ VAŠICH SAMOSTATNÝCH SOUBORŮ Z GITHUB REPOZITÁŘE -->
    <script src="jjjjjjjjsemnastvany.js"></script>

    <script>
        function loadSite() {
            const url = document.getElementById('urlInput').value;
            // Spuštění přes skriptové jádro z jjjjjjjjsemnastvany.js
            FoxOS.openApp('Web', url);
        }
    </script>
</body>
</html>
