<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FoxBrowser</title>
    <style>
        :root {
            --fox-orange: #ff6000;
            --bg-dark: #121214;
            --bar-bg: #1e1e24;
            --input-bg: #2a2a32;
            --text-main: #f1f1f5;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background: var(--bg-dark); color: var(--text-main); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

        /* Lišta prohlížeče */
        .browser-bar {
            height: 48px; background: var(--bar-bg); display: flex;
            align-items: center; padding: 0 12px; gap: 8px; border-bottom: 1px solid #2a2a32;
        }

        .btn {
            background: transparent; border: none; color: var(--text-main);
            width: 32px; height: 32px; border-radius: 6px; cursor: pointer; font-size: 16px;
        }
        .btn:hover { background: #2a2a32; }

        .address-container {
            flex: 1; display: flex; align-items: center;
            background: var(--input-bg); border-radius: 6px; padding: 0 10px; height: 34px;
        }

        .address-bar {
            width: 100%; background: transparent; border: none; outline: none;
            color: var(--text-main); font-size: 13px;
        }

        /* Výstupní okno */
        .viewport { flex: 1; position: relative; background: #fff; }
        iframe { width: 100%; height: 100%; border: none; }

        /* Loader */
        #loader {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(18, 18, 20, 0.9); color: var(--fox-orange);
            display: none; align-items: center; justify-content: center;
            font-weight: bold; font-size: 18px; z-index: 10;
        }
    </style>
</head>
<body>

    <div class="browser-bar">
        <button class="btn" id="reloadBtn" title="Obnovit">&#128472;</button>
        <div class="address-container">
            <input type="text" class="address-bar" id="urlInput" placeholder="Napište web (např. seznam.cz nebo google.com) a stiskněte Enter...">
        </div>
    </div>

    <div class="viewport">
        <div id="loader">Načítám stránku přes FoxEngine...</div>
        <iframe id="webFrame"></iframe>
    </div>

    <!-- Načtení externího skriptu -->
    <script src="foxbrowser.js"></script>
</body>
</html>
